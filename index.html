<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e27">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Yoga-Zen">
    <title>🧘 YOGA-ZEN: 90s Edition</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%2300ffff'>🧘</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%230a0e27' width='180' height='180'/><text x='90' y='130' font-size='100' text-anchor='middle' fill='%2300ffff'>🧘</text></svg>">
    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
            --neon-yellow: #ffff00;
            --neon-green: #00ff00;
            --neon-blue: #0099ff;
            --dark-bg: #0a0e27;
            --dark-secondary: #1a1f3a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Courier New', monospace;
            background-color: var(--dark-bg);
            color: var(--neon-cyan);
            overflow: hidden;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(0, 255, 255, 0.05) 25%, rgba(0, 255, 255, 0.05) 26%, transparent 27%, transparent 74%, rgba(0, 255, 255, 0.05) 75%, rgba(0, 255, 255, 0.05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 255, 255, 0.05) 25%, rgba(0, 255, 255, 0.05) 26%, transparent 27%, transparent 74%, rgba(0, 255, 255, 0.05) 75%, rgba(0, 255, 255, 0.05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
        }

        .container {
            width: 100%;
            max-width: 100vw;
            height: 100vh;
            max-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .app-wrapper {
            width: 100%;
            max-width: 900px;
            height: 100%;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            background: rgba(26, 31, 58, 0.8);
            border: 3px solid var(--neon-cyan);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5), inset 0 0 20px rgba(0, 255, 255, 0.1);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            padding: 15px 10px;
            border-bottom: 2px solid var(--neon-cyan);
            background: linear-gradient(180deg, rgba(0, 255, 255, 0.1) 0%, transparent 100%);
        }

        .title {
            font-size: clamp(20px, 5vw, 40px);
            font-weight: bold;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-magenta);
            color: var(--neon-cyan);
            letter-spacing: 2px;
            animation: flicker 0.3s infinite alternate;
            margin-bottom: 5px;
        }

        @keyframes flicker {
            0% { text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-magenta); }
            50% { text-shadow: 0 0 10px var(--neon-magenta), 0 0 20px var(--neon-cyan); }
            100% { text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-yellow); }
        }

        .subtitle {
            font-size: clamp(10px, 3vw, 14px);
            color: var(--neon-magenta);
            letter-spacing: 1px;
        }

        .content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel {
            background: rgba(0, 30, 50, 0.6);
            border: 2px solid var(--neon-cyan);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.05);
        }

        .panel-title {
            color: var(--neon-magenta);
            font-size: clamp(12px, 2.5vw, 16px);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 5px var(--neon-magenta);
        }

        .pose-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 250px;
            background: rgba(0, 50, 80, 0.4);
            border-radius: 5px;
            overflow: hidden;
        }

        .pose-image {
            width: 90%;
            height: 90%;
            object-fit: contain;
            filter: drop-shadow(0 0 10px var(--neon-cyan));
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .pose-name {
            text-align: center;
            color: var(--neon-yellow);
            font-size: clamp(11px, 2vw, 14px);
            margin-top: 10px;
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-box {
            background: rgba(0, 30, 50, 0.8);
            border: 1px solid var(--neon-cyan);
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-size: clamp(10px, 2vw, 12px);
        }

        .stat-label {
            color: var(--neon-magenta);
            font-size: clamp(9px, 1.5vw, 11px);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            color: var(--neon-yellow);
            font-size: clamp(14px, 3vw, 18px);
            font-weight: bold;
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        .visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 40px;
            margin-top: 10px;
        }

        .bar {
            width: 8px;
            background: linear-gradient(to top, var(--neon-cyan), var(--neon-magenta));
            border-radius: 2px;
            box-shadow: 0 0 8px var(--neon-cyan);
            animation: bounce 0.4s ease-in-out infinite;
        }

        .bar:nth-child(1) { animation-delay: 0s; }
        .bar:nth-child(2) { animation-delay: 0.1s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.3s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { height: 8px; }
            50% { height: 35px; }
        }

        .track-info {
            background: rgba(0, 30, 50, 0.8);
            border: 1px solid var(--neon-cyan);
            padding: 10px;
            border-radius: 5px;
            color: var(--neon-yellow);
            font-size: clamp(11px, 2vw, 13px);
            text-align: center;
            text-shadow: 0 0 5px var(--neon-yellow);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: clamp(8px, 2vw, 12px) clamp(15px, 3vw, 25px);
            font-size: clamp(12px, 2.5vw, 14px);
            font-family: 'Courier New', monospace;
            border: 2px solid var(--neon-cyan);
            background: rgba(0, 255, 255, 0.1);
            color: var(--neon-cyan);
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
            font-weight: bold;
            touch-action: manipulation;
        }

        button:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        button.play-btn {
            border-color: var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        button.play-btn:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.6);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 30, 50, 0.8);
            padding: 12px;
            border: 1px solid var(--neon-cyan);
            border-radius: 5px;
        }

        .slider-label {
            color: var(--neon-magenta);
            font-size: clamp(10px, 2vw, 12px);
            text-transform: uppercase;
            min-width: 50px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, var(--neon-cyan), var(--neon-magenta));
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--neon-cyan);
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-cyan);
            border: 2px solid var(--neon-magenta);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--neon-cyan);
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-cyan);
            border: 2px solid var(--neon-magenta);
        }

        .volume-value {
            color: var(--neon-yellow);
            font-size: clamp(11px, 2vw, 13px);
            min-width: 40px;
            text-align: right;
        }

        .relax-meter {
            background: rgba(0, 30, 50, 0.8);
            border: 1px solid var(--neon-cyan);
            padding: 10px;
            border-radius: 5px;
        }

        .relax-label {
            color: var(--neon-magenta);
            font-size: clamp(10px, 2vw, 12px);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .relax-bar {
            width: 100%;
            height: 20px;
            background: rgba(0, 30, 80, 0.6);
            border: 1px solid var(--neon-cyan);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .relax-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green), var(--neon-yellow));
            width: 80%;
            border-radius: 3px;
            box-shadow: 0 0 10px var(--neon-cyan);
            transition: width 0.3s ease;
        }

        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
                padding: 15px;
            }

            .app-wrapper {
                border-radius: 5px;
            }
        }

        @media (max-width: 600px) {
            .title {
                font-size: 20px;
            }

            .content {
                padding: 10px;
                gap: 10px;
            }

            .panel {
                padding: 10px;
            }

            .button-group {
                gap: 5px;
            }

            button {
                padding: 8px 12px;
                font-size: 12px;
            }
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--neon-yellow);
            box-shadow: 0 0 8px var(--neon-yellow);
            animation: blink 1s infinite;
            margin-left: 8px;
        }

        .status-indicator.hidden {
            display: none;
        }

        @keyframes blink {
            0%, 49%, 100% { opacity: 1; }
            50%, 99% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-wrapper">
            <div class="header">
                <div class="title">🧘 YOGA-ZEN <span class="status-indicator hidden" id="statusIndicator"></span></div>
                <div class="subtitle">90s Edition • Zen Meditation</div>
            </div>

            <div class="content">
                <div class="column">
                    <div class="panel">
                        <div class="panel-title">Current Pose</div>
                        <div class="pose-container">
                            <img id="poseImage" class="pose-image" src="" alt="Current Yoga Pose">
                        </div>
                        <div class="pose-name" id="poseName">Mountain Pose</div>
                    </div>

                    <div class="panel">
                        <div class="panel-title">Session Stats</div>
                        <div class="stats">
                            <div class="stat-box">
                                <div class="stat-label">Session Time</div>
                                <div class="stat-value" id="sessionTime">00:00:00</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Tracks Played</div>
                                <div class="stat-value" id="tracksPlayed">0</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Poses Shown</div>
                                <div class="stat-value" id="posesShown">0</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Relax Level</div>
                                <div class="stat-value" id="relaxLevel">80%</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="column">
                    <div class="panel">
                        <div class="panel-title">Now Playing</div>
                        <div class="track-info" id="trackInfo">Zen Meditation Breeze</div>
                        <div class="visualizer">
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                        </div>
                    </div>

                    <div class="panel controls-section">
                        <div class="panel-title">Controls</div>
                        <div class="button-group">
                            <button class="play-btn" id="playBtn" onclick="app.play()">▶ Play</button>
                            <button id="pauseBtn" onclick="app.pause()" disabled>⏸ Pause</button>
                            <button id="stopBtn" onclick="app.stop()" disabled>⏹ Stop</button>
                        </div>

                        <div class="slider-group">
                            <label class="slider-label">Volume</label>
                            <input type="range" id="volumeSlider" min="0" max="100" value="60" oninput="app.setVolume(this.value)">
                            <span class="volume-value" id="volumeValue">60%</span>
                        </div>

                        <div class="relax-meter">
                            <div class="relax-label">Relaxation Progress</div>
                            <div class="relax-bar">
                                <div class="relax-fill" id="relaxFill"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class YogaZenApp {
            constructor() {
                this.isPlaying = false;
                this.currentTrackIndex = 0;
                this.currentPoseIndex = 0;
                this.sessionTime = 0;
                this.tracksPlayed = 0;
                this.posesShown = 1;
                this.relaxLevel = 80;

                // Embedded audio tracks (using Web Audio API generated tones)
                this.tracks = [
                    { name: 'Zen Meditation Breeze', id: 'track0' },
                    { name: 'Tranquil Garden Vibes', id: 'track1' },
                    { name: 'Morning Sunrise Calm', id: 'track2' },
                    { name: 'Forest Whispers', id: 'track3' },
                    { name: 'Ocean Waves Serenity', id: 'track4' },
                    { name: 'Himalayan Peace', id: 'track5' }
                ];

                // Embedded yoga poses (emoji + text)
                this.poses = [
                    { name: 'Mountain Pose', emoji: '🧘' },
                    { name: 'Child Pose', emoji: '🙏' },
                    { name: 'Tree Pose', emoji: '🌳' },
                    { name: 'Downward Dog', emoji: '🐕' },
                    { name: 'Warrior Pose', emoji: '⚔️' },
                    { name: 'Lotus Position', emoji: '🪷' },
                    { name: 'Cat-Cow Stretch', emoji: '🐱' },
                    { name: 'Savasana', emoji: '😴' }
                ];

                this.audio = new Audio();
                this.audio.volume = 0.6;
                this.audioContext = null;
                this.oscillators = [];

                this.initializeAudio();
                this.updatePose();
                this.setupEventListeners();
            }

            initializeAudio() {
                // Create audio context for Web Audio API fallback
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.audioContext = new AudioContext();
            }

            setupEventListeners() {
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.isPlaying ? this.pause() : this.play();
                    }
                });
            }

            play() {
                if (this.isPlaying) return;
                
                this.isPlaying = true;
                document.getElementById('playBtn').disabled = true;
                document.getElementById('pauseBtn').disabled = false;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('statusIndicator').classList.remove('hidden');

                // Generate ambient meditation sounds
                this.playMeditationSound();

                // Start timers
                this.sessionTimer = setInterval(() => this.updateSessionTime(), 1000);
                this.trackRotationTimer = setInterval(() => this.nextTrack(), (120 + Math.random() * 60) * 1000);
                this.poseRotationTimer = setInterval(() => this.nextPose(), 120000);
                this.relaxTimer = setInterval(() => this.increaseRelaxation(), 5000);

                this.tracksPlayed++;
                this.updateUI();
            }

            pause() {
                this.isPlaying = false;
                document.getElementById('playBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = true;
                document.getElementById('statusIndicator').classList.add('hidden');

                clearInterval(this.sessionTimer);
                clearInterval(this.trackRotationTimer);
                clearInterval(this.poseRotationTimer);
                clearInterval(this.relaxTimer);

                if (this.audioContext.state === 'running') {
                    this.audioContext.suspend();
                }
            }

            stop() {
                this.pause();
                this.sessionTime = 0;
                this.relaxLevel = 80;
                this.posesShown = 1;
                this.currentTrackIndex = 0;
                this.currentPoseIndex = 0;
                document.getElementById('stopBtn').disabled = true;
                this.updateUI();
                this.updatePose();
            }

            playMeditationSound() {
                if (this.audioContext.state === 'suspended') {
                    this.audioContext.resume();
                }

                // Create a simple ambient meditation sound
                const now = this.audioContext.currentTime;
                const duration = 2;

                // Base frequency that changes by track
                const baseFreq = 100 + (this.currentTrackIndex * 20);
                
                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.2, now + duration * 0.5);
                osc.frequency.exponentialRampToValueAtTime(baseFreq, now + duration);

                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

                osc.connect(gain);
                gain.connect(this.audioContext.destination);

                osc.start(now);
                osc.stop(now + duration);

                this.oscillators.push({ osc, gain });

                // Schedule next sound
                if (this.isPlaying) {
                    setTimeout(() => this.playMeditationSound(), duration * 1000);
                }
            }

            nextTrack() {
                if (!this.isPlaying) return;
                this.currentTrackIndex = (this.currentTrackIndex + 1) % this.tracks.length;
                this.tracksPlayed++;
                this.updateUI();
            }

            nextPose() {
                if (!this.isPlaying) return;
                this.currentPoseIndex = (this.currentPoseIndex + 1) % this.poses.length;
                this.posesShown++;
                this.updatePose();
                this.updateUI();
            }

            updateSessionTime() {
                this.sessionTime++;
                this.updateUI();
            }

            increaseRelaxation() {
                if (this.relaxLevel < 100) {
                    this.relaxLevel += Math.random() * 5;
                    this.relaxLevel = Math.min(this.relaxLevel, 100);
                    this.updateUI();
                }
            }

            updatePose() {
                const pose = this.poses[this.currentPoseIndex];
                document.getElementById('poseImage').textContent = pose.emoji;
                document.getElementById('poseImage').style.fontSize = '100px';
                document.getElementById('poseImage').style.lineHeight = '1';
                document.getElementById('poseImage').style.textAlign = 'center';
                document.getElementById('poseName').textContent = pose.name;
            }

            setVolume(value) {
                const volume = value / 100;
                this.audio.volume = volume;
                document.getElementById('volumeValue').textContent = value + '%';
            }

            updateUI() {
                // Session time
                const hours = Math.floor(this.sessionTime / 3600);
                const minutes = Math.floor((this.sessionTime % 3600) / 60);
                const seconds = this.sessionTime % 60;
                const timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                document.getElementById('sessionTime').textContent = timeStr;

                // Stats
                document.getElementById('tracksPlayed').textContent = this.tracksPlayed;
                document.getElementById('posesShown').textContent = this.posesShown;
                document.getElementById('relaxLevel').textContent = Math.round(this.relaxLevel) + '%';
                
                // Track info
                document.getElementById('trackInfo').textContent = this.tracks[this.currentTrackIndex].name;

                // Relax meter
                document.getElementById('relaxFill').style.width = this.relaxLevel + '%';
            }
        }

        // Initialize app when page loads
        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new YogaZenApp();
        });
    </script>
</body>
</html>
