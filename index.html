<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a4d3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Yoga-Zen">
    <title>🧘 YOGA-ZEN: Meditation Flow</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%235dd9d9'>🧘</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%231a4d3d' width='180' height='180'/><text x='90' y='130' font-size='130' fill='%235dd9d9'>🧘</text></svg>">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --water-light: #5dd9d9;
            --water-dark: #2b7a7a;
            --forest-dark: #1a4d3d;
            --stone-light: #e8e8e8;
            --stone-medium: #c4c4c4;
            --stone-dark: #4a4a4a;
            --accent-warm: #d4a574;
            --accent-muted: #a8d5ba;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f3d35 0%, #1a4d3d 50%, #0f3d35 100%);
            color: var(--stone-light);
            overflow: hidden;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 100vw;
            height: 100vh;
            max-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .app-wrapper {
            width: 100%;
            max-width: 1000px;
            height: 100%;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(26, 77, 61, 0.95) 0%, rgba(15, 61, 53, 0.95) 100%);
            border: 2px solid rgba(93, 217, 217, 0.4);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 0 30px rgba(93, 217, 217, 0.1);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            padding: 20px 15px;
            border-bottom: 1px solid rgba(93, 217, 217, 0.2);
            background: linear-gradient(180deg, rgba(93, 217, 217, 0.08) 0%, transparent 100%);
        }

        .title {
            font-size: clamp(24px, 6vw, 44px);
            font-weight: 300;
            letter-spacing: 3px;
            color: var(--water-light);
            text-shadow: 0 2px 8px rgba(93, 217, 217, 0.2);
            margin-bottom: 5px;
            word-spacing: 8px;
        }

        .subtitle {
            font-size: clamp(11px, 3vw, 13px);
            color: var(--water-light);
            letter-spacing: 2px;
            opacity: 0.7;
            text-transform: uppercase;
            font-weight: 300;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
            gap: 20px;
        }

        .main-section {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .panel {
            background: linear-gradient(135deg, rgba(43, 122, 122, 0.4) 0%, rgba(26, 77, 61, 0.6) 100%);
            border: 1px solid rgba(93, 217, 217, 0.2);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 0 20px rgba(93, 217, 217, 0.05);
            backdrop-filter: blur(10px);
        }

        .panel-title {
            color: var(--water-light);
            font-size: clamp(13px, 2.5vw, 15px);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 400;
            opacity: 0.9;
        }

        .pose-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .pose-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            width: 100%;
            background: linear-gradient(135deg, rgba(93, 217, 217, 0.08) 0%, rgba(168, 213, 186, 0.05) 100%);
            border-radius: 12px;
            overflow: hidden;
            font-size: 120px;
            line-height: 1;
            position: relative;
        }

        .pose-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(93, 217, 217, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(168, 213, 186, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .pose-image {
            animation: float 4s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .pose-info {
            text-align: center;
            width: 100%;
        }

        .pose-name {
            color: var(--stone-light);
            font-size: clamp(16px, 3vw, 20px);
            font-weight: 500;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .track-name {
            color: var(--water-light);
            font-size: clamp(12px, 2vw, 14px);
            opacity: 0.8;
            letter-spacing: 0.5px;
            font-style: italic;
            text-transform: uppercase;
        }

        .bottom-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-box {
            background: linear-gradient(135deg, rgba(43, 122, 122, 0.3) 0%, rgba(26, 77, 61, 0.5) 100%);
            border: 1px solid rgba(93, 217, 217, 0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            background: linear-gradient(135deg, rgba(93, 217, 217, 0.15) 0%, rgba(168, 213, 186, 0.08) 100%);
            border-color: rgba(93, 217, 217, 0.4);
        }

        .stat-label {
            color: var(--water-light);
            font-size: clamp(10px, 1.8vw, 11px);
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 1px;
            opacity: 0.8;
            font-weight: 500;
        }

        .stat-value {
            color: var(--accent-warm);
            font-size: clamp(18px, 3.5vw, 24px);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: clamp(10px, 2vw, 13px) clamp(18px, 4vw, 28px);
            font-size: clamp(12px, 2.5vw, 14px);
            font-family: 'Segoe UI', sans-serif;
            border: 1px solid rgba(93, 217, 217, 0.4);
            background: linear-gradient(135deg, rgba(93, 217, 217, 0.15) 0%, rgba(43, 122, 122, 0.2) 100%);
            color: var(--water-light);
            cursor: pointer;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            font-weight: 500;
            touch-action: manipulation;
        }

        button:hover {
            background: linear-gradient(135deg, rgba(93, 217, 217, 0.25) 0%, rgba(168, 213, 186, 0.15) 100%);
            border-color: rgba(93, 217, 217, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(93, 217, 217, 0.2);
        }

        button:active {
            transform: translateY(0px);
        }

        button.play-btn {
            border-color: rgba(168, 213, 186, 0.6);
            background: linear-gradient(135deg, rgba(168, 213, 186, 0.2) 0%, rgba(93, 217, 217, 0.15) 100%);
            color: var(--accent-muted);
        }

        button.play-btn:hover {
            background: linear-gradient(135deg, rgba(168, 213, 186, 0.3) 0%, rgba(93, 217, 217, 0.25) 100%);
            border-color: rgba(168, 213, 186, 0.8);
            box-shadow: 0 8px 20px rgba(168, 213, 186, 0.2);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, rgba(43, 122, 122, 0.3) 0%, rgba(26, 77, 61, 0.5) 100%);
            padding: 14px;
            border: 1px solid rgba(93, 217, 217, 0.2);
            border-radius: 10px;
        }

        .slider-label {
            color: var(--water-light);
            font-size: clamp(11px, 2vw, 12px);
            text-transform: uppercase;
            min-width: 55px;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        input[type="range"] {
            flex: 1;
            height: 5px;
            border-radius: 3px;
            background: linear-gradient(to right, rgba(93, 217, 217, 0.3), rgba(168, 213, 186, 0.3));
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--water-light);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(93, 217, 217, 0.5);
            border: 2px solid rgba(26, 77, 61, 0.8);
            transition: all 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(93, 217, 217, 0.7);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--water-light);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(93, 217, 217, 0.5);
            border: 2px solid rgba(26, 77, 61, 0.8);
            transition: all 0.2s ease;
        }

        .volume-value {
            color: var(--accent-warm);
            font-size: clamp(11px, 2vw, 12px);
            min-width: 40px;
            text-align: right;
            font-weight: 500;
        }

        .relax-meter {
            background: linear-gradient(135deg, rgba(43, 122, 122, 0.3) 0%, rgba(26, 77, 61, 0.5) 100%);
            border: 1px solid rgba(93, 217, 217, 0.2);
            padding: 14px;
            border-radius: 10px;
        }

        .relax-label {
            color: var(--water-light);
            font-size: clamp(11px, 2vw, 12px);
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .relax-bar {
            width: 100%;
            height: 18px;
            background: rgba(26, 77, 61, 0.6);
            border: 1px solid rgba(93, 217, 217, 0.2);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .relax-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--water-light), var(--accent-muted), var(--accent-warm));
            width: 80%;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(93, 217, 217, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.2);
            transition: width 0.4s ease;
        }

        @media (max-width: 1024px) {
            .content {
                padding: 15px;
                gap: 15px;
            }

            .bottom-section {
                grid-template-columns: 1fr;
            }

            .app-wrapper {
                border-radius: 15px;
            }
        }

        @media (max-width: 600px) {
            .title {
                font-size: 22px;
            }

            .content {
                padding: 12px;
                gap: 12px;
            }

            .panel {
                padding: 15px;
            }

            .pose-container {
                min-height: 200px;
                font-size: 80px;
            }

            .button-group {
                gap: 8px;
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .bottom-section {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-muted);
            box-shadow: 0 0 8px var(--accent-muted);
            animation: pulse-indicator 1.5s ease-in-out infinite;
            margin-left: 8px;
        }

        .status-indicator.hidden {
            display: none;
        }

        @keyframes pulse-indicator {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(93, 217, 217, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(93, 217, 217, 0.2);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(93, 217, 217, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-wrapper">
            <div class="header">
                <div class="title">🧘 YOGA-ZEN <span class="status-indicator hidden" id="statusIndicator"></span></div>
                <div class="subtitle">Meditation Flow</div>
            </div>

            <div class="content">
                <div class="main-section">
                    <div class="panel">
                        <div class="panel-title">Current Pose</div>
                        <div class="pose-section">
                            <div class="pose-container">
                                <div id="poseImage" class="pose-image">🧘</div>
                            </div>
                            <div class="pose-info">
                                <div class="pose-name" id="poseName">Mountain Pose</div>
                                <div class="track-name" id="trackName">Zen Meditation Breeze</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bottom-section">
                    <div class="panel">
                        <div class="panel-title">Session Progress</div>
                        <div class="stats-grid">
                            <div class="stat-box">
                                <div class="stat-label">Session Time</div>
                                <div class="stat-value" id="sessionTime">00:00:00</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Tracks Played</div>
                                <div class="stat-value" id="tracksPlayed">0</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Poses Shown</div>
                                <div class="stat-value" id="posesShown">0</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Relax Level</div>
                                <div class="stat-value" id="relaxLevel">80%</div>
                            </div>
                        </div>
                    </div>

                    <div class="panel controls-group">
                        <div class="panel-title">Controls & Progress</div>
                        <div class="button-group">
                            <button class="play-btn" id="playBtn" onclick="app.play()">▶ Play</button>
                            <button id="pauseBtn" onclick="app.pause()" disabled>⏸ Pause</button>
                            <button id="stopBtn" onclick="app.stop()" disabled>⏹ Stop</button>
                        </div>

                        <div class="slider-group">
                            <label class="slider-label">Volume</label>
                            <input type="range" id="volumeSlider" min="0" max="100" value="60" oninput="app.setVolume(this.value)">
                            <span class="volume-value" id="volumeValue">60%</span>
                        </div>

                        <div class="relax-meter">
                            <div class="relax-label">Relaxation Progress</div>
                            <div class="relax-bar">
                                <div class="relax-fill" id="relaxFill"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class YogaZenApp {
            constructor() {
                this.isPlaying = false;
                this.currentTrackIndex = 0;
                this.currentPoseIndex = 0;
                this.sessionTime = 0;
                this.tracksPlayed = 0;
                this.posesShown = 1;
                this.relaxLevel = 80;
                this.volume = 0.6;

                // Embedded tracks (using Web Audio API)
                this.tracks = [
                    { name: 'Zen Meditation Breeze', freq: 100 },
                    { name: 'Tranquil Garden Vibes', freq: 120 },
                    { name: 'Morning Sunrise Calm', freq: 140 },
                    { name: 'Forest Whispers', freq: 160 },
                    { name: 'Ocean Waves Serenity', freq: 180 },
                    { name: 'Himalayan Peace', freq: 200 }
                ];

                // Embedded yoga poses with emoji
                this.poses = [
                    { name: 'Mountain Pose', emoji: '🧘' },
                    { name: 'Child Pose', emoji: '🙏' },
                    { name: 'Tree Pose', emoji: '🌳' },
                    { name: 'Downward Dog', emoji: '🐕' },
                    { name: 'Warrior Pose', emoji: '⚔️' },
                    { name: 'Lotus Position', emoji: '🪷' },
                    { name: 'Cat-Cow Stretch', emoji: '🐱' },
                    { name: 'Savasana', emoji: '😴' }
                ];

                this.audioContext = null;
                this.oscillators = [];
                this.initializeAudio();
                this.updatePose();
                this.setupEventListeners();
                this.registerServiceWorker();
            }

            initializeAudio() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.audioContext = new AudioContext();
            }

            registerServiceWorker() {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('sw.js').catch(() => {
                        // Service worker registration failed, app still works
                    });
                }
            }

            setupEventListeners() {
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.isPlaying ? this.pause() : this.play();
                    }
                });
            }

            play() {
                if (this.isPlaying) return;
                
                this.isPlaying = true;
                document.getElementById('playBtn').disabled = true;
                document.getElementById('pauseBtn').disabled = false;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('statusIndicator').classList.remove('hidden');

                this.playMeditationSound();

                this.sessionTimer = setInterval(() => this.updateSessionTime(), 1000);
                this.trackRotationTimer = setInterval(() => this.nextTrack(), (120 + Math.random() * 60) * 1000);
                this.poseRotationTimer = setInterval(() => this.nextPose(), 120000);
                this.relaxTimer = setInterval(() => this.increaseRelaxation(), 5000);

                this.tracksPlayed++;
                this.updateUI();
            }

            pause() {
                this.isPlaying = false;
                document.getElementById('playBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = true;
                document.getElementById('statusIndicator').classList.add('hidden');

                clearInterval(this.sessionTimer);
                clearInterval(this.trackRotationTimer);
                clearInterval(this.poseRotationTimer);
                clearInterval(this.relaxTimer);

                if (this.audioContext.state === 'running') {
                    this.audioContext.suspend();
                }
            }

            stop() {
                this.pause();
                this.sessionTime = 0;
                this.relaxLevel = 80;
                this.posesShown = 1;
                this.currentTrackIndex = 0;
                this.currentPoseIndex = 0;
                document.getElementById('stopBtn').disabled = true;
                this.updateUI();
                this.updatePose();
            }

            playMeditationSound() {
                if (this.audioContext.state === 'suspended') {
                    this.audioContext.resume();
                }

                const now = this.audioContext.currentTime;
                const duration = 2;
                const track = this.tracks[this.currentTrackIndex];
                const baseFreq = track.freq;
                
                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.2, now + duration * 0.5);
                osc.frequency.exponentialRampToValueAtTime(baseFreq, now + duration);

                gain.gain.setValueAtTime(0.3 * this.volume, now);
                gain.gain.exponentialRampToValueAtTime(0.1 * this.volume, now + duration);

                osc.connect(gain);
                gain.connect(this.audioContext.destination);

                osc.start(now);
                osc.stop(now + duration);

                if (this.isPlaying) {
                    setTimeout(() => this.playMeditationSound(), duration * 1000);
                }
            }

            nextTrack() {
                if (!this.isPlaying) return;
                this.currentTrackIndex = (this.currentTrackIndex + 1) % this.tracks.length;
                this.tracksPlayed++;
                this.updateUI();
            }

            nextPose() {
                if (!this.isPlaying) return;
                this.currentPoseIndex = (this.currentPoseIndex + 1) % this.poses.length;
                this.posesShown++;
                this.updatePose();
                this.updateUI();
            }

            updateSessionTime() {
                this.sessionTime++;
                this.updateUI();
            }

            increaseRelaxation() {
                if (this.relaxLevel < 100) {
                    this.relaxLevel += Math.random() * 5;
                    this.relaxLevel = Math.min(this.relaxLevel, 100);
                    this.updateUI();
                }
            }

            updatePose() {
                const pose = this.poses[this.currentPoseIndex];
                document.getElementById('poseImage').textContent = pose.emoji;
                document.getElementById('poseName').textContent = pose.name;
            }

            setVolume(value) {
                this.volume = value / 100;
                document.getElementById('volumeValue').textContent = value + '%';
            }

            updateUI() {
                const hours = Math.floor(this.sessionTime / 3600);
                const minutes = Math.floor((this.sessionTime % 3600) / 60);
                const seconds = this.sessionTime % 60;
                const timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                document.getElementById('sessionTime').textContent = timeStr;

                document.getElementById('tracksPlayed').textContent = this.tracksPlayed;
                document.getElementById('posesShown').textContent = this.posesShown;
                document.getElementById('relaxLevel').textContent = Math.round(this.relaxLevel) + '%';
                document.getElementById('trackName').textContent = this.tracks[this.currentTrackIndex].name;
                document.getElementById('relaxFill').style.width = this.relaxLevel + '%';
            }
        }

        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new YogaZenApp();
        });
    </script>
</body>
</html>
